<script>
function f_idfind(){
	var mb_name = $("#mb_name").val();
	var mb_email = $("#mb_email_id").val();
	
	if(mb_name == ""){
		Swal.fire("", "이름을 입력해주세요.", "error");
		return;
	}
	
	if(mb_email == ""){
		Swal.fire("", "이메일을 입력해주세요.", "error");
		return;
	}
	
	var mb_id_check = "";
	$.ajax({
		async: false,
		cache: false,
		type: "POST",
		url: "<?php echo G5_BBS_URL;?>/ajax.find_id.php",
		data: {mb_name: mb_name, mb_email: mb_email},
		success: function(result) {
			mb_id_check = result;
        }
	});

	if(mb_id_check){
		Swal.fire("", "회원님의 ID : " + mb_id_check + " 입니다.", "success");
		return;
	}else{
		Swal.fire("", "회원정보가 없습니다.", "error");
		return;
	}
}

function f_passfind(){
	var mb_id = $("#mb_id").val();
	var mb_email = $("#mb_email_pass").val();
	
	if(mb_id == ""){
		Swal.fire("", "아이디를 입력해주세요.", "error");
		return;
	}
	
	if(mb_email == ""){
		Swal.fire("", "이메일을 입력해주세요.", "error");
		return;
	}
	
	var mb_id_check = "";
	$.ajax({
		async: false,
		cache: false,
		type: "POST",
		url: "<?php echo G5_BBS_URL;?>/ajax.find_pass.php",
		data: {mb_id: mb_id, mb_email: mb_email},
		success: function(result) {
			mb_id_check = result;
        }
	});

	if(mb_id_check == "y"){
		Swal.fire("", "회원님의 이메일로 임시 비밀번호를 전달했습니다.", "success");
		return;
	}else{
		Swal.fire("", "회원정보가 없습니다.", "error");
		return;
	}
}
</script>
