<script>
function f_login(){
	var mb_id = $("#mb_id").val();
	var mb_password = $("#mb_password").val();
	
	if(mb_id == ""){
		Swal.fire("", "아이디를 입력해주세요.", "error");
		return;
	}
	
	if(mb_password == ""){
		Swal.fire("", "비밀번호를 입력해주세요.", "error");
		return;
	}
	
	var frm = document.flogin;
	frm.submit();
}

$('#mb_password').keyup(function(e){
	if(e.keyCode == 13)  f_login();
});
</script>
