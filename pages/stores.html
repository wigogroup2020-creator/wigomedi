<script>
(function(){
    var q=document.getElementById('storeQ'); if(!q) return;
    var cards=[].slice.call(document.querySelectorAll('.store-card')), tabs=[].slice.call(document.querySelectorAll('.store-regions button')),
        none=document.getElementById('storeNone'), count=document.getElementById('storeCount'), region='';
    function run(){
        var t=q.value.trim().toLowerCase(), n=0;
        cards.forEach(function(c){
            var ok=(!region||c.getAttribute('data-region')===region)&&(!t||c.getAttribute('data-text').indexOf(t)>-1);
            c.hidden=!ok; if(ok) n++;
        });
        if(none) none.hidden=n>0;
        count.textContent=(region||t)?'검색 결과 '+n+'곳':'';
    }
    tabs.forEach(function(b){b.addEventListener('click',function(){
        region=b.getAttribute('data-region');
        tabs.forEach(function(x){var on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on);});
        run();
    });});
    q.addEventListener('input',run);
    document.getElementById('storeGo').addEventListener('click',run);
})();
</script>
