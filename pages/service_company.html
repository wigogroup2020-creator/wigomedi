
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>약관 보기</title>
    <style>
        .sub_header {
            position: relative;
        }
        .sub_header {
            height: 60px;
            padding: 0 12px;
            display: flex;
            align-items: center;
        }
        .sub_header .prev {
            width: 30px;
            height: 30px;
            margin-left: 4px;
        }
        .sub_header h2 {
            margin-left: 14px;
            font-weight: normal;
            font-size: 18px;
        }
        main {
            padding-bottom:60px;
        }
        main p {
            padding:0 12px;
            font-weight:300;
            font-size:1.14rem;
            line-height:30px;
            text-align:justify;
        }
        main p ~ p {
            margin-top:8px;
        }
        main p span {
            letter-spacing: 0pt;
            font-weight: bold;
        }
        main p span:first-child {
            font-size: 12px;
        }
        main ul, main ol {
            list-style: none;
            padding: 0 12px;
            font-weight: 300;
        }
        main ul li {
            padding: 10px;
            border: 1px solid black;
            display: flex;
            justify-content: space-around;
        }
        main ul li:first-child {
            font-size: 14px;
        }
        main ul li:last-child {
            border-top: none;
        }
        main ul li span {
            flex: 1;
            text-align: center;
        }
        a {
            color: black;
        }
    </style>
</head>
<body>
    <div class="sub_header">
        <div class="prev">
            <a href="javascript:history.back();">
                <img src="/img/common/pre_btn.png" alt="이전으로">
            </a>
        </div>
        <h2>개인정보 수집 및 이용동의</h2>
    </div>
    <main>
        <p>
            '주식회사 위고'는 (이하 '회사'는) 고객님의 개인정보를 중요시하며, "정보통신망 이용촉진 및 정보보호"에 관한 법률을 준수하고 있습니다.
            회사는 개인정보취급방침을 통하여 고객님께서 제공하시는 개인정보가 어떠한 용도와 방식으로 이용되고 있으며, 개인정보보호를 위해 어떠한 조치가 취해지고 있는지 알려드립니다.
            회사는 개인정보취급방침을 개정하는 경우 웹사이트 공지사항(또는 개별공지)을 통하여 공지할 것입니다.
        </p>
        <p>&nbsp;</p>
        
    </main>
</body>
</html>
