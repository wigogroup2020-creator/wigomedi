
name: WigoMedi Cafe24 Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wigomedi-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout WigoMedi source
          uses: actions/checkout@v4
          with:
          ref: wigomedi
          persist-credentials: false

      - name: Deploy preview
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dry-run: true
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env*
            **/*.sql
            **/*.sql.gz
            **/*.bak
            **/*.zip
            **/*.log
            **/data/**
            **/uploads/**
            **/config.php
  
