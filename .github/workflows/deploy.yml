name: WigoMedi Cafe24 SFTP Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wigomedi-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout WigoMedi source
        uses: actions/checkout@v5
        with:
          ref: wigomedi
          persist-credentials: false

      - name: Install SFTP password helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sshpass

      - name: Configure verified SSH host key
        env:
          SFTP_HOST_KEY: ${{ secrets.SFTP_HOST_KEY }}
        run: |
          set -eu
          test -n "$SFTP_HOST_KEY" || { echo "SFTP_HOST_KEY secret is missing"; exit 1; }
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SFTP_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Test Cafe24 SFTP login (read-only)
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          test -n "$SFTP_HOST" || { echo "FTP_SERVER secret is missing"; exit 1; }
          test -n "$SFTP_USER" || { echo "FTP_USERNAME secret is missing"; exit 1; }
          test -n "$SSHPASS" || { echo "FTP_PASSWORD secret is missing"; exit 1; }

          printf 'pwd\nls\nbye\n' | sshpass -e sftp \
            -oBatchMode=no \
            -oPreferredAuthentications=password,keyboard-interactive \
            -oStrictHostKeyChecking=yes \
            -oUserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -oConnectTimeout=15 \
            -P 22 \
            -b - \
            "$SFTP_USER@$SFTP_HOST"
