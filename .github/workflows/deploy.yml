
name: WigoMedi Cafe24 SFTP Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wigomedi-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout WigoMedi source
        uses: actions/checkout@v4
        with:
          ref: wigomedi
          persist-credentials: false

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Test SFTP connection
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
          SFTP_HOST_KEY: ${{ secrets.SFTP_HOST_KEY }}
        run: |
          set -eu

          test -n "$SFTP_HOST"
          test -n "$SFTP_USER"
          test -n "$SFTP_PASS"
          test -n "$SFTP_HOST_KEY"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SFTP_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=yes \
            -oConnectTimeout=15 \
            -P 22 \
            -b /dev/stdin \
            "$SFTP_USER@$SFTP_HOST" <<'EOF'
          pwd
          ls
          bye
          EOF
